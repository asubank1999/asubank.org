<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>You're offline | UniHub</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f2f2f7">
    <link rel="icon" href="/assets/img/favicon2.ico" type="image/x-icon">
    <script>try{var d=localStorage.getItem('darkMode');if(d==='enabled'||(d===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <link rel="stylesheet" href="/assets/app/app.css?v=4">
    <script src="/assets/app/app.js?v=4" defer></script>
</head>
<body class="ab">
    <main class="ab-wrap">
        <div class="ab-empty" style="padding-top:18vh">
            <svg class="ab-empty-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/><path d="M3 3l18 18"/></svg>
            <h3>You're offline</h3>
            <p>This page has not been saved on your device yet. Pages you opened before, your Saved list and the subject lists still work.</p>
            <p lang="ar" dir="rtl" style="margin-top:6px">أنت غير متصل بالإنترنت. الصفحات التي فتحتها سابقاً ما زالت تعمل.</p>
            <div class="ab-btn-row" style="justify-content:center;margin-top:16px">
                <button class="ab-btn sm" type="button" onclick="location.reload()">Try again</button>
                <a class="ab-btn sm tinted" href="/guides/saved">Saved files</a>
                <a class="ab-btn sm gray" href="/">Home</a>
            </div>
        </div>
    </main>
</body>
</html>
