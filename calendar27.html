<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0d2340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>العد التنازلي للأحداث الجامعية 2026/2027</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230d2340'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle' fill='%23c9a227'%3E🎓%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0d2340;
      --navy-deep: #081527;
      --navy-soft: #16335c;
      --gold: #c9a227;
      --gold-soft: #e0c368;
      --maroon: #8b1e3f;
      --green: #2e7d32;
      --bg: #f7f5ef;
      --card-bg: #ffffff;
      --text: #1c2b3a;
      --muted: #6b7688;
      --border: #e4e0d4;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(13, 35, 64, 0.08);
      --font-head: 'Amiri', 'Georgia', serif;
      --font-body: 'Tajawal', 'Segoe UI', sans-serif;
      --transition: all 0.3s ease;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
      background-image:
        radial-gradient(circle at 15% 0%, rgba(201, 162, 39, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(13, 35, 64, 0.05) 0%, transparent 40%);
      padding-bottom: var(--safe-bottom);
    }

    /* ===== Header ===== */
    header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
      color: #f5f2e8;
      padding: 1.8rem 1rem 1.6rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid var(--gold);
    }
    header::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(201,162,39,0.18) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.35;
    }
    .crest {
      font-size: 2rem;
      margin-bottom: 0.3rem;
      position: relative;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    }
    header h1 {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      letter-spacing: 0.3px;
      position: relative;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      line-height: 1.3;
    }
    header .subtitle {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: var(--gold-soft);
      letter-spacing: 0.5px;
      position: relative;
      font-weight: 500;
    }
    header .divider {
      width: 60px; height: 2px;
      background: var(--gold);
      margin: 0.8rem auto 0;
      position: relative;
      border-radius: 2px;
    }

    /* ===== Main ===== */
    main {
      padding: 1rem 0.8rem 1.8rem;
      max-width: 1320px;
      margin: 0 auto;
    }

    .back-link-wrap {
      text-align: center;
      margin: -1.2rem 0 1rem;
      position: relative;
      z-index: 5;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      color: var(--navy);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .back-link:hover {
      background: var(--navy);
      color: var(--gold-soft);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(13, 35, 64, 0.18);
    }

    /* ===== Table Container ===== */
    #events-table {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 1rem 0.8rem 0.8rem;
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .section-heading::before, .section-heading::after {
      content: '';
      height: 1px;
      width: 25px;
      background: var(--gold);
      flex-shrink: 0;
    }
    .section-heading .year-badge {
      background: var(--gold);
      color: var(--navy);
      font-size: 0.7rem;
      padding: 0.1rem 0.8rem;
      border-radius: 999px;
      font-family: var(--font-body);
      font-weight: 700;
    }

    /* ===== Table ===== */
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 2px;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      min-width: 520px;
      font-size: 0.85rem;
    }

    thead th {
      background: var(--navy);
      color: #f5f2e8;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 10px 6px;
      text-align: center;
      position: sticky;
      top: 0;
      word-break: break-word;
      z-index: 2;
      letter-spacing: 0.3px;
    }
    thead th:nth-child(1) { width: 15%; }
    thead th:nth-child(2) { width: 12%; }
    thead th:nth-child(3) { width: 10%; }
    thead th:nth-child(4) { width: 40%; }
    thead th:nth-child(5) { width: 23%; }

    tbody td {
      padding: 10px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      word-break: break-word;
      overflow-wrap: anywhere;
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: #fbfaf5; }
    tbody tr:hover { background: rgba(201, 162, 39, 0.08); }

    tbody td:first-child {
      font-weight: 700;
      color: var(--navy);
      font-size: 0.7rem;
      line-height: 1.3;
    }
    tbody td:nth-child(2) {
      color: var(--muted);
      font-size: 0.65rem;
    }
    tbody td:nth-child(3) {
      font-weight: 700;
      color: var(--gold);
      font-size: 0.7rem;
      direction: ltr;
    }
    tbody td:nth-child(4) {
      text-align: right;
      padding-right: 8px;
      font-size: 0.78rem;
      line-height: 1.5;
    }
    tbody td:last-child {
      font-family: 'Consolas', 'Courier New', monospace;
      color: var(--maroon);
      font-weight: 700;
      letter-spacing: 0.2px;
      font-size: 0.7rem;
      line-height: 1.3;
      direction: ltr;
    }
    tbody td:last-child .countdown-ended {
      color: var(--green);
    }

    /* ===== Season Divider ===== */
    .season-divider td {
      background: var(--navy-deep) !important;
      color: var(--gold-soft) !important;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 6px;
      text-align: center;
      border-bottom: 2px solid var(--gold);
    }
    .season-divider td:last-child {
      color: var(--gold-soft) !important;
      font-family: var(--font-body);
    }
    .season-divider td:nth-child(3) {
      text-align: center;
      padding-right: 6px;
    }
    .season-divider td:nth-child(4) {
      text-align: center;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 1.2rem 1rem;
      background: var(--navy-deep);
      color: rgba(245, 242, 232, 0.7);
      font-size: 0.7rem;
      margin-top: 1.6rem;
    }
    footer .gold-text { color: var(--gold-soft); }

    /* ===== Dark mode toggle ===== */
    #mode-toggle {
      position: fixed;
      top: 12px;
      left: 12px;
      background: var(--card-bg);
      color: var(--navy);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.7rem;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #mode-toggle:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(13,35,64,0.18);
    }
    #mode-toggle:active {
      transform: scale(0.95);
    }

    /* ===== Dark mode ===== */
    body.dark-mode {
      --bg: #0b1420;
      --card-bg: #131f30;
      --text: #eef1f5;
      --muted: #8b98a8;
      --border: #223146;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    body.dark-mode header { background: linear-gradient(135deg, #081527 0%, #050d18 100%); }
    body.dark-mode thead th { background: #0a1526; }
    body.dark-mode tbody tr:nth-child(even) { background: #101b2b; }
    body.dark-mode tbody tr:hover { background: rgba(201, 162, 39, 0.1); }
    body.dark-mode tbody td:first-child { color: var(--gold-soft); }
    body.dark-mode .back-link { background: var(--card-bg); color: var(--gold-soft); border-color: var(--border); }
    body.dark-mode #mode-toggle { background: var(--card-bg); color: var(--gold-soft); border-color: var(--border); }
    body.dark-mode .section-heading .year-badge { background: var(--gold-soft); color: var(--navy-deep); }
    body.dark-mode .season-divider td { background: #050d18 !important; }

    /* ===== Mobile Optimizations ===== */
    @media (max-width: 480px) {
      header { padding: 1.4rem 0.8rem 1.2rem; }
      header h1 { font-size: 1.1rem; }
      .crest { font-size: 1.6rem; }
      header .subtitle { font-size: 0.7rem; }
      
      main { padding: 0.6rem 0.4rem 1.2rem; }
      
      .section-heading { 
        font-size: 0.95rem; 
        padding: 0.8rem 0.4rem 0.6rem;
        gap: 4px;
      }
      .section-heading::before, .section-heading::after {
        width: 15px;
      }
      .section-heading .year-badge { font-size: 0.6rem; padding: 0.05rem 0.6rem; }
      
      table { 
        min-width: 420px; 
        font-size: 0.75rem;
      }
      
      thead th { 
        font-size: 0.6rem; 
        padding: 8px 4px;
      }
      thead th:nth-child(1) { width: 14%; }
      thead th:nth-child(2) { width: 11%; }
      thead th:nth-child(3) { width: 10%; }
      thead th:nth-child(4) { width: 40%; }
      thead th:nth-child(5) { width: 25%; }
      
      tbody td { 
        padding: 8px 4px; 
        font-size: 0.7rem;
      }
      tbody td:first-child { font-size: 0.6rem; }
      tbody td:nth-child(2) { font-size: 0.55rem; }
      tbody td:nth-child(3) { font-size: 0.6rem; }
      tbody td:nth-child(4) { 
        font-size: 0.65rem; 
        padding-right: 4px;
      }
      tbody td:last-child { 
        font-size: 0.6rem;
        line-height: 1.2;
      }
      
      .season-divider td { 
        font-size: 0.7rem; 
        padding: 6px 4px;
      }
      
      .back-link-wrap { margin: -1rem 0 0.6rem; }
      .back-link { 
        font-size: 0.7rem; 
        padding: 0.4rem 1rem;
      }
      
      #mode-toggle {
        top: 8px;
        left: 8px;
        padding: 4px 10px;
        font-size: 0.6rem;
      }
      #mode-toggle span { font-size: 0.7rem; }
      
      footer { font-size: 0.6rem; padding: 1rem 0.8rem; }
    }

    @media (max-width: 380px) {
      table { min-width: 360px; font-size: 0.7rem; }
      thead th { font-size: 0.55rem; padding: 6px 3px; }
      tbody td { padding: 6px 3px; font-size: 0.6rem; }
      tbody td:first-child { font-size: 0.55rem; }
      tbody td:nth-child(4) { font-size: 0.6rem; }
      tbody td:last-child { font-size: 0.5rem; }
      
      .section-heading { font-size: 0.85rem; }
      header h1 { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* Touch-friendly tap targets */
    .back-link, #mode-toggle {
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <button id="mode-toggle"><span id="mode-icon">🌙</span><span id="mode-label">الوضع الليلي</span></button>

  <header>
    <div class="crest">🎓</div>
    <h1>العد التنازلي للأحداث الجامعية</h1>
    <div class="subtitle">جامعة كل العرب · 2026/2027</div>
    <div class="divider"></div>
  </header>

  <main>
    <div class="back-link-wrap">
      <a href="index" class="back-link">ASU Bank 👈🏽</a>
    </div>

    <section id="events-table">
      <h2 class="section-heading">
        <span>جدول الأحداث</span>
        <span class="year-badge">2026/2027</span>
      </h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>اليوم</th>
              <th>الأسبوع</th>
              <th>الحدث</th>
              <th>العد التنازلي</th>
            </tr>
          </thead>
          <tbody id="events-body">
            <!-- Event rows will be dynamically added here -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>جميع الحقوق محفوظة <span class="gold-text">&copy; 2026</span> — جامعة كل العرب</p>
  </footer>

  <!-- Load the 2026/2027 events script -->
  <script src="data/asu_date_script2026_27.js"></script>

  <script>
    // ===== Dark mode toggle =====
    const modeToggle = document.getElementById('mode-toggle');
    const modeIcon = document.getElementById('mode-icon');
    const modeLabel = document.getElementById('mode-label');

    function setModeUI(isDark) {
      modeIcon.textContent = isDark ? '☀️' : '🌙';
      modeLabel.textContent = isDark ? 'الوضع النهاري' : 'الوضع الليلي';
    }

    modeToggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      setModeUI(isDark);
    });

    modeToggle.addEventListener('touchstart', (e) => {
      // Allow touch event to trigger click
    }, { passive: true });

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved === 'dark' || (!saved && prefersDark);
      if (isDark) document.body.classList.add('dark-mode');
      setModeUI(isDark);
    });

    // ===== Security measures =====
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      const blocked =
        (e.ctrlKey && ['c', 'v', 'x', 'u', 'a', 's'].includes(key)) ||
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['i', 'j', 'c', 'k'].includes(key));
      if (blocked) e.preventDefault();
    });
  </script>
