# Builds the UniHub Android app (android/) on GitHub's Linux machines.
#  - Every push that touches android/ builds the APK (Actions run page > Artifacts) and takes
#    emulator screenshots into the android-screenshots branch.
#  - Pushing a tag like android-v1.2.0 also publishes a public GitHub Release with the APK.
#  - Optional signing secrets (otherwise the APK is signed with a debug key):
#      ANDROID_KEYSTORE_BASE64  base64 of the .jks keystore file
#      ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#    See android/README.md.
name: Android app

on:
  push:
    branches: ['**']
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      store:
        description: Also build the Google Play bundle (.aab)
        type: boolean
        default: false

# a newer push replaces a running build (they would race to push the screenshots branch)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the screenshots branch and the release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Signing key (if the secrets are set)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore"
          else
            echo "No keystore secret: signing with a debug key"
          fi
      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon assembleRelease
          V=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cp android/app/build/outputs/apk/release/app-release.apk "UniHub-$V.apk"
          echo "V=$V" >> "$GITHUB_ENV"
          ls -la UniHub-*.apk
      - name: Keep the APK as a download (Actions run page > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: UniHub-apk-${{ github.run_number }}
          path: UniHub-*.apk
          retention-days: 30

      - name: Google Play bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.store }}
        env:
          STORE_BUILD: 'true'
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon bundleRelease
      - name: Keep the Play bundle as a download
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.store }}
        uses: actions/upload-artifact@v4
        with:
          name: UniHub-play-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Enable KVM for the emulator
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots on an emulator
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/screenshots.sh "UniHub-${{ env.V }}.apk"
      - name: Push the screenshots to the android-screenshots branch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b android-screenshots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Android screenshots, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-screenshots

      - name: Publish a GitHub Release (tags android-v*)
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # One release page for both apps. The iOS build adds its IPA to this same release.
          python3 tools/release_notes.py android "$V" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "UniHub $V" --notes-file "$RUNNER_TEMP/notes.md" --latest || true
          gh release upload "$TAG" "UniHub-$V.apk" --clobber
      - name: Point the README download link at this version
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#android-v}"
          git fetch -q origin main && git checkout -q -B main origin/main
          sed -i -E "s#releases/download/android-v[0-9.]+/(ASUBank|UniHub)-[0-9.]+\.apk#releases/download/$TAG/UniHub-$V.apk#; s#Android app \(v[0-9.]+\)#Android app (v$V)#" README.md
          git diff --quiet && exit 0
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git commit -qam "README: Android download link -> $V" && git push -q origin main
