# Builds the ASU Bank iOS app (ios/) on GitHub's macOS machines, so no Mac is needed.
#  - Every push that touches ios/ checks that the app compiles (no Apple account needed).
#  - Actions > "iOS app" > Run workflow with "Send to TestFlight" ticked signs the app, uploads it to
#    App Store Connect (TestFlight) and keeps the .ipa as a download. Needs these repository secrets:
#      APPLE_TEAM_ID   10-character Team ID (developer.apple.com > Membership)
#      ASC_KEY_ID      App Store Connect API key ID
#      ASC_ISSUER_ID   App Store Connect API issuer ID
#      ASC_KEY_P8      full text of the downloaded AuthKey_XXXX.p8 file
#    See ios/PUBLISHING.md.
name: iOS app

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Send to TestFlight
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ASUBank.xcodeproj -scheme ASUBank -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see ios/PUBLISHING.md)"; exit 1; }; done
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Save the App Store Connect key
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
      - name: Archive (signed by Apple's cloud signing)
        run: |
          set -o pipefail
          xcodebuild -project ASUBank.xcodeproj -scheme ASUBank -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ASUBank.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            archive | xcbeautify --renderer github-actions
      - name: Export .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ASUBank.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
      - name: Keep the .ipa as a download
        uses: actions/upload-artifact@v4
        with:
          name: ASUBank-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
      - name: Upload to App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-app --type ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
