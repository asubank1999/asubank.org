# Builds the ASU Bank iOS app (ios/) on GitHub's macOS machines, so no Mac is needed.
#  - Every push that touches ios/ checks that the app compiles (no Apple account needed).
#  - Actions > "iOS app" > Run workflow with "Send to TestFlight" ticked signs the app, uploads it to
#    App Store Connect (TestFlight) and keeps the .ipa as a download. Needs these repository secrets:
#      APPLE_TEAM_ID   10-character Team ID (developer.apple.com > Membership)
#      ASC_KEY_ID      App Store Connect API key ID
#      ASC_ISSUER_ID   App Store Connect API issuer ID
#      ASC_KEY_P8      full text of the downloaded AuthKey_XXXX.p8 file
#    See ios/PUBLISHING.md.
name: iOS app

on:
  push:
    branches: ['**']
    paths: ['ios/**', '.github/workflows/ios.yml']
    tags: ['ios-v*'] # pushing a tag like ios-v1.2.0 also publishes a public GitHub Release with the IPA
  workflow_dispatch:
    inputs:
      release:
        description: Send to TestFlight
        type: boolean
        default: false

# a newer push replaces a running build (they would race to push the screenshots branch)
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # pushes the screenshots branch
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if 'Pro Max' in x['name']]
          c.sort(key=lambda kx: [int(n) for n in kx[0].split('iOS-')[-1].split('-')])
          print(c[-1][1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ASUBank.xcodeproj -scheme ASUBank -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions
      - name: Screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/ASUBank.app
          mkdir -p "$RUNNER_TEMP/shots"
          shot() { # name, wait, launch args...
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" org.asubank.app 2>/dev/null || true
            xcrun simctl launch "$UDID" org.asubank.app "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$name.png"
          }
          shot 0-welcome-terms 25 -startTab home
          shot 1-home 8 -ab.terms.accepted.v1 YES -startTab home
          shot 2-home-dark 8 -ab.terms.accepted.v1 YES -startTab home -ab.appearance 2
          shot 3-search 15 -ab.terms.accepted.v1 YES -startTab search -startQuery calculus
          shot 4-search-dark 15 -ab.terms.accepted.v1 YES -startTab search -startQuery "pharmacology" -ab.appearance 2
          shot 5-upload 6 -ab.terms.accepted.v1 YES -startTab upload
          shot 6-saved 5 -ab.terms.accepted.v1 YES -startTab saved
          shot 7-more 5 -ab.terms.accepted.v1 YES -startTab more
          shot 8-more-dark 5 -ab.terms.accepted.v1 YES -startTab more -ab.appearance 2
          shot 9-halls 6 -ab.terms.accepted.v1 YES -startTab home -startPath /guides/halls
          shot 10-ratings-intro 6 -ab.terms.accepted.v1 YES -startTab home -startPath /requests/portal_to_rating
          shot 11-ratings 25 -ab.terms.accepted.v1 YES -ab.rate.intro.v1 YES -startTab home -startPath /requests/portal_to_rating
          cd "$RUNNER_TEMP/shots" && ls -la
          git init -q && git checkout -q -b ios-screenshots
          echo "Simulator screenshots of ${{ github.sha }} (made by .github/workflows/ios.yml)" > README.md
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Screenshots of ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ios-screenshots
      - name: Unsigned IPA for sideloading (Sideloadly re-signs it with your Apple ID)
        run: |
          set -o pipefail
          xcodebuild -project ASUBank.xcodeproj -scheme ASUBank -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcbeautify --renderer github-actions
          rm -rf Payload && mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/ASUBank.app Payload/
          zip -qry ASUBank-unsigned.ipa Payload
          ls -la ASUBank-unsigned.ipa
      - name: Keep the unsigned IPA as a download (Actions run page > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ASUBank-unsigned-ipa-${{ github.run_number }}
          path: ios/ASUBank-unsigned.ipa
          retention-days: 30
      - name: Publish a GitHub Release (tags ios-v*)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#ios-v}"
          cp ios/ASUBank-unsigned.ipa "ASUBank-$V-unsigned.ipa"
          gh release create "$TAG" "ASUBank-$V-unsigned.ipa" --title "ASU Bank $V (iOS)" --notes-file ios/RELEASE_NOTES.md --latest

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see ios/PUBLISHING.md)"; exit 1; }; done
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Save the App Store Connect key
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
      - name: Archive (signed by Apple's cloud signing)
        run: |
          set -o pipefail
          xcodebuild -project ASUBank.xcodeproj -scheme ASUBank -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ASUBank.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            archive | xcbeautify --renderer github-actions
      - name: Export .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ASUBank.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
      - name: Keep the .ipa as a download
        uses: actions/upload-artifact@v4
        with:
          name: ASUBank-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
      - name: Upload to App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-app --type ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
