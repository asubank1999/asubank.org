# Every 30 minutes: copies YouTube links students shared into the search index, so the apps find them with no app update
name: YouTube links

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-links
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy links
        run: python tools/sync_links.py
      - name: Commit if changed
        run: |
          git add -N tools/synced-links.json 2>/dev/null || true
          if git diff --quiet -- assets/app/materials.json tools/synced-links.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app/materials.json tools/synced-links.json
          git commit -m "Update the search index with shared YouTube links"
          git pull --rebase origin main
          git push
