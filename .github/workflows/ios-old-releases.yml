# One-time job: publishes the earlier app versions as GitHub Releases, using the unsigned IPAs
# their builds already made (kept as workflow artifacts). Skips any version that already has a release.
# Newer versions are released by ios.yml when a tag like ios-v1.3.0 is pushed.
# The tags themselves are pushed from a maintainer machine (the workflow token may not create them).
name: iOS old releases

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-old-releases.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish 1.0.0 and 1.1.0
        run: |
          publish() { # version, run id, artifact, commit, notes
            if gh release view "ios-v$1" >/dev/null 2>&1; then echo "ios-v$1 already released"; return; fi
            gh run download "$2" -n "$3" -D "dl-$1"
            cp "$(find "dl-$1" -name '*.ipa' | head -1)" "ASUBank-$1-unsigned.ipa"
            printf '%s\n\nUnsigned IPA: install it with Sideloadly or AltStore, which sign it with your own Apple ID.\nASU Bank is a free, volunteer, non-profit project, not affiliated with the university.\n' "$5" > notes.md
            gh release create "ios-v$1" "ASUBank-$1-unsigned.ipa" --target "$4" --title "ASU Bank $1 (iOS)" --notes-file notes.md --latest=false
          }
          publish 1.0.0 41524777844 ASUBank-unsigned-ipa-4 a47e7f5f3e6473188c0b1d9bf387f463d51ecce5 \
            "First version of the native ASU Bank app: home, subject banks, Google Drive search, upload, saved files and dark mode."
          publish 1.1.0 41533733129 ASUBank-unsigned-ipa-6 014725c8cba3487a8cdd7c49b41bd576c40354dd \
            "Native pages synced with asubank.org, native academic calendar, welcome terms, donate (PayPal / CliQ), app version, update alerts, storage and Clear cache. Fixed Request a material."
