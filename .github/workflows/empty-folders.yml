# Once a day: hides empty Drive folders from Latest uploads, and brings back any that now have files.
name: Empty folders

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empty-folders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check folders
        run: python tools/hide_empty_folders.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/app/broken.json assets/app/drive-map.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app/broken.json assets/app/drive-map.json
          git commit -m "Update the list of empty folders"
          git pull --rebase origin main
          git push
