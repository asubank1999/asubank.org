# XcodeGen spec: `xcodegen generate` (run by .github/workflows/ios.yml) creates ASUBank.xcodeproj.
# The .xcodeproj is not committed; change settings here.
name: ASUBank
options:
  bundleIdPrefix: org.unihub
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.19.0"
    CURRENT_PROJECT_VERSION: "19"
    DEVELOPMENT_TEAM: ""
    AB_STORE_BUILD: "NO"
targets:
  ASUBank:
    type: application
    platform: iOS
    sources:
      - path: ASUBank
        excludes:
          - Info.plist
    info:
      path: ASUBank/Info.plist
      properties:
        CFBundleDisplayName: UniHub
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ABStoreBuild: $(AB_STORE_BUILD)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: UniHub uses the camera for stories and to scan paper notes and exams into a PDF you can upload.
        NSMicrophoneUsageDescription: UniHub records sound for voice messages and when you film a video story.
        NSPhotoLibraryUsageDescription: UniHub lets you pick photos and videos of notes to upload.
        NSPhotoLibraryAddUsageDescription: UniHub saves stories you download to your photos, with a UniHub watermark.
        BGTaskSchedulerPermittedIdentifiers:
          - org.unihub.app.chat
        UIBackgroundModes:
          - fetch
        CFBundleURLTypes:
          - CFBundleURLName: org.unihub.app
            CFBundleURLSchemes: [asubank]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.unihub.app
        PRODUCT_NAME: ASUBank
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconNavy IconCap IconCards IconBook"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      - name: List the alternate icon files
        basedOnDependencyAnalysis: false
        script: |
          P="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          B=/usr/libexec/PlistBuddy
          for n in IconNavy IconCap IconCards IconBook; do
            K=":CFBundleIcons:CFBundleAlternateIcons:$n:CFBundleIconFiles"
            $B -c "Delete $K" "$P" 2>/dev/null || true
            $B -c "Add $K array" -c "Add $K:0 string ${n}60x60" "$P"
            K=":CFBundleIcons~ipad:CFBundleAlternateIcons:$n:CFBundleIconFiles"
            $B -c "Delete $K" "$P" 2>/dev/null || true
            $B -c "Add $K array" -c "Add $K:0 string ${n}60x60" -c "Add $K:1 string ${n}76x76" -c "Add $K:2 string ${n}83.5x83.5" "$P"
          done
  ASUBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ASUBankUITests
    dependencies:
      - target: ASUBank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.unihub.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  ASUBank:
    build:
      targets:
        ASUBank: all
        ASUBankUITests: [test]
    test:
      config: Debug
      targets:
        - ASUBankUITests
    archive:
      config: Release
